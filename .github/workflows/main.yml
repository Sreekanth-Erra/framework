name: Quarterly Regression Suite

on:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Run Regression Suite
        run: mvn clean test -DsuiteXmlFile=final.xml

name: Manual Regression Suite

on:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Verify Maven
        run: mvn -version

      - name: Run TestNG Regression Suite
        run: mvn clean test -DsuiteXmlFile=final.xml
